[Settings]
; L key toggles hud on and off ingame on the fly
ToggleKey=76

; > for peek hud
PeekKey=190

; recap tab button (16 = shift)
ContinueKey=16
ContinueText=PRESS TO CONTINUE

; crt scan filter and film grain (disabled by default)
FX=0

; pauses cutscenes (80 = P) make sure to set "AllowAltTabbingWithoutPausing" to 1 in "GTASA.WidescreenFix.ini" if you want to alt-tab without skipping the cutscene
EnableCutscenePause=1
CSKey=80